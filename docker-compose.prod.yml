# Production API + worker. Neon, CloudAMQP, Cognito, and OpenAI stay external.
# Nginx on the EC2 host should proxy to 127.0.0.1:3000.
#
# Required next to this file on the server:
#   .env  — DATABASE_URL, Cognito, RABBITMQ_URL (CloudAMQP), FRONTEND_URL, etc.
#   DOCKERHUB_USERNAME — Docker Hub user that GitHub Actions publishes as
#                        ${DOCKERHUB_USERNAME}/journalapp-backend:<tag>
#   BACKEND_IMAGE_TAG — SemVer Docker tag to run in production (e.g. v0.1.0)
#                       Production must NOT rely on the mutable "latest" tag.
#   alloy/config.alloy — Grafana Alloy log-shipping config
#   GRAFANA_CLOUD_LOGS_URL, GRAFANA_CLOUD_LOGS_USERNAME, GRAFANA_CLOUD_LOGS_TOKEN

services:
  api:
    image: ${DOCKERHUB_USERNAME}/journalapp-backend:${BACKEND_IMAGE_TAG}
    container_name: clarity-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    command: ["node", "dist/server.js"]

  worker:
    image: ${DOCKERHUB_USERNAME}/journalapp-backend:${BACKEND_IMAGE_TAG}
    container_name: clarity-worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    command: ["node", "dist/workers/weeklyReportWorker.js"]

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: clarity-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      GRAFANA_CLOUD_LOGS_URL: ${GRAFANA_CLOUD_LOGS_URL}
      GRAFANA_CLOUD_LOGS_USERNAME: ${GRAFANA_CLOUD_LOGS_USERNAME}
      GRAFANA_CLOUD_LOGS_TOKEN: ${GRAFANA_CLOUD_LOGS_TOKEN}
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      - api
      - worker

volumes:
  alloy-data:
